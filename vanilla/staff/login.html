<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ديليشس ميتس | بوابة الموظفين</title>
  <meta name="description" content="تسجيل دخول الموظفين لإدارة الطلبات والمنتجات.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-icon">🛠</div>
        <h1 data-i18n="staffLoginTitle">بوابة الموظفين</h1>
        <p data-i18n="staffLoginSubtitle">تسجيل الدخول لإدارة الطلبات والمنتجات</p>
      </div>

      <div id="login-alert" class="auth-alert" role="alert"></div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="f-user" data-i18n="username">اسم المستخدم</label>
          <input id="f-user" type="text" class="form-input" placeholder="اسم المستخدم" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="f-pass" data-i18n="password">كلمة المرور</label>
          <input id="f-pass" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span data-i18n="loginBtn">تسجيل الدخول</span>
        </button>

      </form>

      <!-- Language toggle -->
      <div style="margin-top:1.25rem;text-align:center;">
        <button class="lang-btn" onclick="i18n.toggleLang()" style="display:inline-flex">
          🌐 <span data-i18n="langToggle">English</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Scripts (paths relative to /staff/) -->
  <script src="../js/i18n.js"></script>
  <script>
    // CREDENTIALS
    const VALID_CREDENTIALS = [
      { user: 'amr elhwary', pass: 'amr9090' },
      { user: 'mostafa_sales', pass: 'dm_sales2026' },
      { user: 'chef_kitchen', pass: 'dm_kitchen2026' },
      { user: 'delivery_admin', pass: 'dm_express2026' },
      { user: 'staff_manager', pass: 'dm_staff8080' }
    ];

    let failedAttempts = parseInt(localStorage.getItem('dm_staff_attempts') || '0', 10);
    let lockoutUntil = parseInt(localStorage.getItem('dm_staff_lockout') || '0', 10);
    let timerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Already logged in? Redirect immediately.
      if (sessionStorage.getItem('dm_staff_auth') === 'true') {
        window.location.href = 'dashboard.html';
        return;
      }

      checkLockoutStatus();
      document.getElementById('login-form').addEventListener('submit', handleLogin);
    });

    function checkLockoutStatus() {
      const alertEl = document.getElementById('login-alert');
      const btnEl = document.getElementById('login-btn');

      if (lockoutUntil && lockoutUntil > Date.now()) {
        btnEl.disabled = true;
        updateLockoutMsg();
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            if (Date.now() >= lockoutUntil) {
              clearInterval(timerInterval);
              timerInterval = null;
              lockoutUntil = 0;
              failedAttempts = 0;
              localStorage.removeItem('dm_staff_lockout');
              localStorage.setItem('dm_staff_attempts', '0');
              alertEl.textContent = '';
              alertEl.classList.remove('error');
              btnEl.disabled = false;
            } else {
              updateLockoutMsg();
            }
          }, 1000);
        }
      }
    }

    function updateLockoutMsg() {
      const alertEl = document.getElementById('login-alert');
      const diff = Math.max(0, lockoutUntil - Date.now());
      const mins = Math.floor(diff / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      alertEl.textContent = `تم حظر محاولات الدخول مؤقتاً لكثرة المحاولات الخاطئة. يرجى الانتظار (${timeStr}) دقيقة.`;
      alertEl.classList.add('error');
    }

    function handleLogin(e) {
      e.preventDefault();

      if (lockoutUntil && lockoutUntil > Date.now()) {
        updateLockoutMsg();
        return;
      }

      const user = document.getElementById('f-user').value.trim().toLowerCase();
      const pass = document.getElementById('f-pass').value;
      const alert = document.getElementById('login-alert');
      const btn  = document.getElementById('login-btn');

      const valid = VALID_CREDENTIALS.some(c => c.user.toLowerCase() === user && c.pass === pass);

      if (valid) {
        sessionStorage.setItem('dm_staff_auth', 'true');
        localStorage.removeItem('dm_staff_lockout');
        localStorage.setItem('dm_staff_attempts', '0');
        btn.textContent = '...';
        btn.disabled = true;
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      } else {
        failedAttempts++;
        localStorage.setItem('dm_staff_attempts', failedAttempts.toString());

        if (failedAttempts >= 5) {
          lockoutUntil = Date.now() + 15 * 60 * 1000; // 15 mins
          localStorage.setItem('dm_staff_lockout', lockoutUntil.toString());
          checkLockoutStatus();
        } else {
          const remaining = 5 - failedAttempts;
          alert.textContent = `${i18n.t('loginError')} (متبقي ${remaining} محاولات قبل الحظر)`;
          alert.classList.add('error');
        }

        // Shake animation on card
        document.querySelector('.auth-card').animate(
          [{ transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
          { duration: 300 }
        );
      }
    }
  </script>
</body>
</html>
